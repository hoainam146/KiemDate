<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3f63">
<title>Quản lý Barcode Mobile</title>
<meta name="description" content="Ứng dụng quản lý barcode sản phẩm, hạn sử dụng, ảnh chụp và xuất Excel.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f4f8;color:#17202a}
header{background:linear-gradient(135deg,#1a3f63 0%,#2e75b6 100%);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 3px 16px rgba(31,78,120,.35)}
h1{font-size:21px;margin:0 0 3px;letter-spacing:-.3px}
.sub{font-size:12px;opacity:.75;letter-spacing:.2px}
main{padding:12px;max-width:700px;margin:auto}

/* Cards */
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.07)}

/* Labels & Inputs */
label{display:block;font-weight:700;font-size:12px;margin:12px 0 5px;color:#2c3e50;text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%;font:inherit;border-radius:12px;border:1.5px solid #d0d9e4;
  padding:12px 14px;background:#fff;transition:border-color .2s,box-shadow .2s;color:#17202a}
input:focus,textarea:focus{outline:none;border-color:#2e75b6;box-shadow:0 0 0 3px rgba(46,117,182,.12)}
input[type=file]{
  width:100%;font:inherit;border-radius:12px;border:1.5px dashed #adc4db;
  padding:10px 14px;background:#f5f9ff;color:#3a5a78;cursor:pointer}
textarea{resize:vertical}

/* Buttons */
button{
  width:100%;font:inherit;border:0;border-radius:12px;padding:13px;
  cursor:pointer;font-weight:700;font-size:14px;
  transition:opacity .15s,transform .1s,box-shadow .2s;letter-spacing:.1px}
button:active:not(:disabled){opacity:.82;transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#1f4e78,#2e75b6);color:#fff;box-shadow:0 4px 12px rgba(31,78,120,.32)}
.btn-green{background:linear-gradient(135deg,#5a9e35,#70ad47);color:#fff;box-shadow:0 4px 10px rgba(112,173,71,.32)}
.btn-orange{background:#f0a070;color:#fff}
.btn-gray{background:#e4ecf2;color:#2c3e50}
.btn-excel{background:linear-gradient(135deg,#1a5c38,#217346);color:#fff;box-shadow:0 4px 10px rgba(33,115,70,.30)}
.btn-csv{background:linear-gradient(135deg,#5a4e99,#7b6fc4);color:#fff;box-shadow:0 4px 10px rgba(90,78,153,.30)}
.btn-backup{background:linear-gradient(135deg,#2a6080,#3a80a8);color:#fff}
.btn-restore{background:#e4ecf2;color:#2c3e50}
.btn-danger{background:linear-gradient(135deg,#a31515,#c0392b);color:#fff;box-shadow:0 4px 10px rgba(192,57,43,.32)}
.btn-remove-photo{background:#fdecea;color:#c0392b;border:1.5px solid #f1c0bb !important;padding:8px !important;font-size:12px;border-radius:9px !important}

/* Grids */
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:linear-gradient(135deg,#eef4fb,#e0ecf7);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:#1f4e78;font-weight:800;line-height:1.1}
.stat .slabel{color:#5a7a98;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* Scanner */
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-top:10px;min-height:180px}

/* Status bar */
.status{padding:10px 14px;border-radius:11px;background:#eef4fb;font-size:13px;
  margin-top:10px;font-weight:600;text-align:center;transition:background .3s,color .3s}

/* Edit banner */
.edit-banner{background:#fff8ec;border:2px solid #f0a070;border-radius:12px;
  padding:9px 13px;font-size:13px;font-weight:700;color:#7a4000;margin-bottom:12px;
  display:flex;align-items:center;gap:7px}

/* Photo preview */
.preview-wrap{margin-top:8px}
.preview-img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;
  border:1.5px solid #d0dde8;display:block}

/* List items */
.item{border:1.5px solid #e4ecf2;border-radius:14px;padding:13px;margin-top:9px;
  background:#fff;transition:box-shadow .2s,border-color .2s;will-change:box-shadow}
.item:hover{box-shadow:0 4px 16px rgba(31,78,120,.09);border-color:#c4d4e4}
.item strong{display:block;font-size:15px;color:#17202a;margin-bottom:3px}
.muted{font-size:12px;color:#68737d;margin-top:2px;line-height:1.6}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;
  font-weight:800;margin-top:6px;letter-spacing:.3px}
.ok{background:#e2f0d9;color:#2a5219}
.soon{background:#fce4d6;color:#7a3010}
.expired{background:#fde0df;color:#7a1010}

/* Photo thumbnail */
.photo-thumb{width:78px;height:78px;object-fit:cover;border-radius:9px;
  margin-top:8px;display:block;border:1.5px solid #d8e5ef;content-visibility:auto}

/* Spinner */
.spinner{display:inline-block;width:13px;height:13px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .55s linear infinite;
  vertical-align:middle;margin-right:5px}
.spinner-dark{border-color:rgba(0,0,0,.15);border-top-color:#444}

@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none!important}
.mt8{margin-top:8px}
.mt12{margin-top:12px}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.pag-btn{width:auto;padding:7px 13px;font-size:13px;border-radius:9px;background:#e4ecf2;color:#2c3e50;border:0;cursor:pointer;font-weight:700;transition:background .15s,transform .1s}
.pag-btn:hover:not(:disabled){background:#d0dce8}
.pag-btn.active{background:linear-gradient(135deg,#1f4e78,#2e75b6);color:#fff}
.pag-btn:disabled{opacity:.4;cursor:not-allowed}
.pag-info{font-size:12px;color:#68737d;font-weight:600;text-align:center;margin-top:6px}

@media(max-width:480px){
  main{padding:8px}
  .row{grid-template-columns:1fr}
  h1{font-size:18px}
}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<header>
  <h1>&#128230; Qu&#7843;n l&#253; Barcode</h1>
  <div class="sub">Camera &middot; Barcode &middot; S&#7889; l&#432;&#7907;ng &middot; HSD &middot; &#7842;nh s&#7843;n ph&#7849;m</div>
</header>

<main>

  <!-- Stats -->
  <section class="card">
    <div class="stats">
      <div class="stat"><b id="totalRows">0</b><div class="slabel">D&ograve;ng</div></div>
      <div class="stat"><b id="totalQty">0</b><div class="slabel">T&#7893;ng SL</div></div>
      <div class="stat"><b id="expiredCount">0</b><div class="slabel">H&#7871;t h&#7841;n</div></div>
    </div>
  </section>

  <!-- Scanner -->
  <section class="card">
    <button class="btn-primary" id="scanBtn">&#128247; B&#7855;t &#273;&#7847;u qu&#233;t Barcode</button>
    <div id="reader" class="hidden"></div>
    <div class="actions mt8">
      <button class="btn-gray hidden" id="stopBtn">&#9209; D&#7915;ng qu&#233;t</button>
      <button class="btn-gray" id="manualBtn">&#9000;&#65039; Nh&#7853;p th&#7911; c&ocirc;ng</button>
    </div>
    <div class="status" id="scanStatus">S&#7861;n s&agrave;ng. B&#7845;m n&uacute;t &#273;&#7875; m&#7903; camera.</div>
  </section>

  <!-- Form -->
  <section class="card" id="formCard">
    <div id="editBanner" class="edit-banner hidden">&#9999;&#65039; &#272;ang ch&#7881;nh s&#7917;a &mdash; b&#7845;m C&#7853;p nh&#7853;t &#273;&#7875; l&#432;u</div>

    <label>Barcode *</label>
    <input id="barcode" type="text" inputmode="numeric" autocomplete="off"
           placeholder="Barcode t&#7921; &#273;i&#7873;n ho&#7863;c nh&#7853;p tay">

    <label>T&ecirc;n s&#7843;n ph&#7849;m</label>
    <input id="pName" type="text" placeholder="T&ecirc;n s&#7843;n ph&#7849;m">

    <div class="row">
      <div>
        <label>S&#7889; l&#432;&#7907;ng *</label>
        <input id="qty" type="number" inputmode="numeric" min="1" value="1">
      </div>
      <div>
        <label>H&#7841;n s&#7917; d&#7909;ng *</label>
        <input id="expiry" type="date">
      </div>
    </div>

    <label>Ng&agrave;y s&#7843;n xu&#7845;t</label>
    <input id="mfg" type="date">

    <label>&#7842;nh s&#7843;n ph&#7849;m</label>
    <input id="photoInput" type="file" accept="image/*" capture="environment">
    <div id="photoPreviewWrap" class="preview-wrap hidden">
      <img id="photoPreview" class="preview-img" src="" alt="Xem tr&#432;&#7899;c &#7843;nh">
      <button class="btn-remove-photo mt8" id="removePhotoBtn">&#128465; X&oacute;a &#7843;nh</button>
    </div>

    <label>Ghi ch&uacute;</label>
    <textarea id="note" rows="2" placeholder="Ghi ch&uacute; th&ecirc;m..."></textarea>

    <div class="actions mt12">
      <button class="btn-green" id="saveBtn">&#128190; L&#432;u</button>
      <button class="btn-orange" id="clearBtn">&#129529; X&oacute;a form</button>
    </div>
  </section>

  <!-- List & Export -->
  <section class="card">
    <label>&#128269; T&igrave;m ki&#7871;m</label>
    <input id="search" type="text" placeholder="Barcode ho&#7863;c t&ecirc;n s&#7843;n ph&#7849;m...">
    <div id="list"></div>
    <div id="pagination"></div>

    <div class="row mt12">
      <button class="btn-excel" id="xlsxBtn">&#128202; Xu&#7845;t Excel (c&oacute; &#7843;nh)</button>
      <button class="btn-csv"   id="csvBtn">&#128196; Xu&#7845;t CSV</button>
    </div>
    <div class="row mt8">
      <button class="btn-backup"  id="jsonBtn">&#128190; Sao l&#432;u JSON</button>
      <button class="btn-restore" id="restoreBtn">&#9851;&#65039; Kh&ocirc;i ph&#7909;c</button>
    </div>
    <input id="restoreInput" type="file" accept=".json" class="hidden">
    <hr style="border:0;border-top:1.5px dashed #e4ecf2;margin:14px 0">
    <button class="btn-danger" id="resetBtn">&#128465; X&oacute;a to&agrave;n b&#7897; d&#7919; li&#7879;u</button>
  </section>

</main>

<script>
"use strict";

// ════════════════════════════════════════════════════════════
// 1. CONSTANTS & STATE
// ════════════════════════════════════════════════════════════
const LS_KEY    = "barcode_v3";
const LS_KEY_V2 = "barcode_inventory_v2"; // legacy key for migration

let records      = [];     // metadata only — no photo blobs here
let html5QrCode  = null;   // scanner instance
let isStarting   = false;  // race-condition guard for startScan()
let photoData    = "";     // base64 of current form photo (or "" if none)
let photoRemoved = false;  // true when user explicitly clicked "Xoa anh"
let editingId    = "";     // UUID of record being edited ("" = creating new)

// ── Incremental stats cache — avoid full-scan on every render ──
// Set dirty=true whenever records change; recalculated lazily in getStats()
let _statsCache = { total: 0, qty: 0, expired: 0, dirty: true };

// ── Filter result cache — avoid re-filtering on every keystroke ──
// Set dirty=true when records change; q tracks last search string
let _filterCache = { q: null, result: null, dirty: true };

// ── RAF render dedup — collapse multiple rapid scheduleRender() calls ──
let _renderPending   = false;
let _renderResetPage = false;

// LRU photo cache — evicts oldest when > MAX_CACHE entries
// Prevents RAM from growing unbounded with 1000+ photos
const MAX_CACHE  = 80;
const photoCache = new Map(); // id → dataUrl  (insertion-order = LRU)

function cacheSet(id, url) {
  if (photoCache.has(id)) photoCache.delete(id); // refresh position
  photoCache.set(id, url);
  if (photoCache.size > MAX_CACHE) photoCache.delete(photoCache.keys().next().value);
}

function cacheGet(id) {
  if (!photoCache.has(id)) return undefined;
  const url = photoCache.get(id);
  photoCache.delete(id); // move to end (most-recently-used)
  photoCache.set(id, url);
  return url;
}

// Pagination state
const PAGE_SIZE = 50;
let currentPage   = 1;
let filteredTotal = 0;

const $ = id => document.getElementById(id);


// ════════════════════════════════════════════════════════════
// 2. INDEXEDDB — photo storage (keeps localStorage lean)
// ════════════════════════════════════════════════════════════
let _db = null;
const dbReady = new Promise((resolve, reject) => {
  const req = indexedDB.open("barcode_photos_v1", 1);
  req.onupgradeneeded = ev => ev.target.result.createObjectStore("photos");
  req.onsuccess = ev => { _db = ev.target.result; resolve(_db); };
  req.onerror   = () => reject(req.error);
});

function idbOp(mode, fn) {
  return dbReady.then(db => new Promise((res, rej) => {
    const tx  = db.transaction("photos", mode);
    const req = fn(tx.objectStore("photos"));
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  }));
}

const savePhotoDB = (id, url) => idbOp("readwrite", s => s.put(url, id));
const getPhotoDB  = id        => idbOp("readonly",  s => s.get(id));
const delPhotoDB  = id        => idbOp("readwrite", s => s.delete(id));

// Fetch multiple photos in PARALLEL (not sequential await-in-loop)
async function fetchPhotos(ids) {
  const result = {};
  await Promise.all(ids.map(async id => {
    const cached = cacheGet(id);
    if (cached) { result[id] = cached; return; }
    const url = await getPhotoDB(id);
    if (url) { cacheSet(id, url); result[id] = url; }
  }));
  return result;
}

// Write photos in parallel batches of N (avoids overloading IDB with 1000+ writes)
async function batchSavePhotos(entries, batchSize = 20) {
  for (let i = 0; i < entries.length; i += batchSize) {
    await Promise.all(
      entries.slice(i, i + batchSize).map(([id, url]) => savePhotoDB(id, url))
    );
  }
}


// ════════════════════════════════════════════════════════════
// 3. LOCALSTORAGE — record metadata (no photos)
// ════════════════════════════════════════════════════════════
function loadRecords() {
  try { records = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
  catch { records = []; }
  invalidateAll();
}

// Defer localStorage write off the critical render path via microtask
// Prevents JSON.stringify(1000 records) from blocking the UI thread
let _storePending = false;
function storeRecords() {
  if (_storePending) return;
  _storePending = true;
  queueMicrotask(() => {
    _storePending = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(records)); }
    catch(e) { alert("Loi luu du lieu: " + e.message); }
  });
}


// ════════════════════════════════════════════════════════════
// 4. CACHE INVALIDATION HELPERS
// ════════════════════════════════════════════════════════════
function invalidateAll() {
  _statsCache.dirty  = true;
  _filterCache.dirty = true;
}

function invalidateFilter() {
  // Called on search input — stats don't need recalculation
  _filterCache.dirty = true;
}

// Compute stats only once per data change (O(n) single pass)
function getStats() {
  if (!_statsCache.dirty) return _statsCache;
  let qty = 0, expired = 0;
  const today = new Date();
  for (const r of records) {
    qty += Number(r.qty || 0);
    if (r.expiry) {
      const days = Math.ceil((new Date(r.expiry + "T23:59:59") - today) / 86400000);
      if (days < 0) expired++;
    }
  }
  _statsCache = { total: records.length, qty, expired, dirty: false };
  return _statsCache;
}

// Compute filtered list only when query or data changes
function getFiltered(q) {
  if (!_filterCache.dirty && _filterCache.q === q) return _filterCache.result;
  const lq     = q.toLowerCase();
  const result = lq
    ? records.filter(r => (r.barcode + " " + (r.name || "")).toLowerCase().includes(lq)).slice().reverse()
    : records.slice().reverse();
  _filterCache = { q, result, dirty: false };
  return result;
}


// ════════════════════════════════════════════════════════════
// 5. UTILITIES
// ════════════════════════════════════════════════════════════
function genId() {
  return typeof crypto.randomUUID === "function"
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g,
    m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

function showMsg(msg, ok = true) {
  const el = $("scanStatus");
  el.textContent      = msg;
  el.style.background = ok ? "#dff2d8" : "#fde8e4";
  el.style.color      = ok ? "#27582a" : "#8a1c1c";
}

function stat(r) {
  if (!r.expiry) return ["CON HAN", "ok"];
  const days = Math.ceil((new Date(r.expiry + "T23:59:59") - new Date()) / 86400000);
  if (days < 0)  return ["DA HET HAN", "expired"];
  if (days <= 7) return ["SAP HET HAN", "soon"];
  return ["CON HAN", "ok"];
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function compressImage(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const w = Math.min(img.width, maxW);
        const h = img.height * (w / img.width);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.68));
      };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(file);
  });
}

function download(blob, name) {
  const a    = document.createElement("a");
  a.href     = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  // Revoke after click event completes
  requestAnimationFrame(() => URL.revokeObjectURL(a.href));
}

function fmtDate() {
  return new Date().toISOString().slice(0, 10);
}


// ════════════════════════════════════════════════════════════
// 6. RENDER — cached stats+filter, paginated, RAF-deduped
// ════════════════════════════════════════════════════════════

// scheduleRender() collapses multiple rapid calls into ONE requestAnimationFrame.
// Call this from event handlers; use render() directly only when you need to await.
function scheduleRender(resetPage = false) {
  if (resetPage) _renderResetPage = true;
  if (_renderPending) return;   // already queued — flag above is enough
  _renderPending = true;
  requestAnimationFrame(() => {
    _renderPending    = false;
    const doReset     = _renderResetPage;
    _renderResetPage  = false;
    _doRender(doReset);
  });
}

async function _doRender(resetPage = false) {
  // ── Stats (cached — O(n) only when dirty) ──────────────
  const s = getStats();
  $("totalRows").textContent    = s.total;
  $("totalQty").textContent     = s.qty;
  $("expiredCount").textContent = s.expired;

  // ── Filter (cached — only recomputes when query/data changed) ──
  const q        = ($("search").value || "").toLowerCase();
  const filtered = getFiltered(q);

  filteredTotal = filtered.length;

  if (!filteredTotal) {
    $("list").innerHTML = `<div class="muted" style="padding:14px 0 4px;text-align:center">
      Chua co du lieu. Quet hoac nhap barcode de bat dau.</div>`;
    renderPagination(0);
    return;
  }

  // Reset to page 1 on new search or data change
  if (resetPage) currentPage = 1;
  const totalPages = Math.ceil(filteredTotal / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;

  // Slice current page (max PAGE_SIZE items, not all 1000+)
  const start     = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  // Build full HTML string first, then ONE innerHTML assignment (one reflow)
  const parts = new Array(pageItems.length);
  for (let i = 0; i < pageItems.length; i++) {
    const r      = pageItems[i];
    const st     = stat(r);
    const safeId = esc(r.id);
    parts[i] = `<div class="item">
      <strong>${esc(r.name || "Chua dat ten")}</strong>
      <div class="muted">&#128278; <b>${esc(r.barcode)}</b> &nbsp;&middot;&nbsp; SL: <b>${esc(r.qty)}</b> &nbsp;&middot;&nbsp; HSD: ${esc(r.expiry || "&#8212;")}</div>
      ${r.mfg  ? `<div class="muted">&#127981; NSX: ${esc(r.mfg)}</div>` : ""}
      ${r.note ? `<div class="muted">&#128221; ${esc(r.note)}</div>`     : ""}
      <span class="badge ${st[1]}">${st[0]}</span>
      ${r.hasPhoto ? `<img id="img_${safeId}" class="photo-thumb" src="" alt="anh" loading="lazy" decoding="async">` : ""}
      <div class="actions" style="margin-top:9px">
        <button class="btn-gray" onclick="editR('${safeId}')">&#9999;&#65039; Sua</button>
        <button class="btn-gray" onclick="delR('${safeId}')">&#128465; Xoa</button>
      </div>
    </div>`;
  }
  $("list").innerHTML = parts.join(""); // single DOM write — one reflow

  renderPagination(totalPages);

  // Lazy-load photos for this page only (max PAGE_SIZE, not 1000+)
  const withPhotos = pageItems.filter(r => r.hasPhoto);
  if (withPhotos.length) {
    const photos = await fetchPhotos(withPhotos.map(r => r.id)); // parallel IDB reads
    // Batch DOM photo writes in one RAF after async fetch — no layout thrash
    requestAnimationFrame(() => {
      for (const [id, url] of Object.entries(photos)) {
        const el = document.getElementById("img_" + id);
        if (el) el.src = url;
      }
    });
  }
}

// Public alias — kept for backward compat (called from goPage / init / save)
async function render(resetPage = false) {
  return _doRender(resetPage);
}

function renderPagination(totalPages) {
  const el = $("pagination");
  if (!el) return;
  if (totalPages <= 1) { el.innerHTML = ""; return; }

  const showing = Math.min(currentPage * PAGE_SIZE, filteredTotal);
  const from    = (currentPage - 1) * PAGE_SIZE + 1;

  // Show max 5 page numbers around current
  const pages = [];
  const delta = 2;
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= currentPage - delta && p <= currentPage + delta)) {
      pages.push(p);
    }
  }
  const withGaps = [];
  let prev = 0;
  for (const p of pages) {
    if (prev && p - prev > 1) withGaps.push("...");
    withGaps.push(p);
    prev = p;
  }

  el.innerHTML = `
    <div class="pagination">
      <button class="pag-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>&#9664;</button>
      ${withGaps.map(p => p === "..."
        ? `<span style="color:#aaa;padding:0 2px">&#8230;</span>`
        : `<button class="pag-btn ${p === currentPage ? "active" : ""}" onclick="goPage(${p})">${p}</button>`
      ).join("")}
      <button class="pag-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>&#9654;</button>
    </div>
    <div class="pag-info">${from}&ndash;${showing} / ${filteredTotal} ban ghi &nbsp;&middot;&nbsp; Trang ${currentPage}/${totalPages}</div>
  `;
}

async function goPage(p) {
  const totalPages = Math.ceil(filteredTotal / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  await render();
  $("search").scrollIntoView({ behavior: "smooth", block: "start" });
}


// ════════════════════════════════════════════════════════════
// 7. FORM — clear / edit / delete
// ════════════════════════════════════════════════════════════
function clearForm() {
  ["barcode","pName","mfg","expiry","note"].forEach(id => $(id).value = "");
  $("qty").value        = "1";
  $("photoInput").value = "";
  photoData    = "";
  photoRemoved = false;
  editingId    = "";
  $("photoPreview").src = "";
  $("photoPreviewWrap").classList.add("hidden");
  $("editBanner").classList.add("hidden");
  $("saveBtn").textContent = "&#128190; Luu";
}

async function editR(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;

  // Populate form WITHOUT removing record from array
  editingId          = id;
  $("barcode").value = r.barcode;
  $("pName").value   = r.name    || "";
  $("qty").value     = r.qty;
  $("mfg").value     = r.mfg    || "";
  $("expiry").value  = r.expiry  || "";
  $("note").value    = r.note   || "";

  $("editBanner").classList.remove("hidden");
  $("saveBtn").textContent = "&#9989; Cap nhat";

  photoData    = "";
  photoRemoved = false;
  $("photoPreviewWrap").classList.add("hidden");

  if (r.hasPhoto) {
    const url = await getPhotoDB(id);
    if (url) {
      photoData             = url;
      $("photoPreview").src = url;
      $("photoPreviewWrap").classList.remove("hidden");
    }
  }

  scrollTo({ top: 0, behavior: "smooth" });
  showMsg("Dang chinh sua: " + (r.name || r.barcode), true);
}

async function delR(id) {
  if (!confirm("Xoa ban ghi nay?")) return;
  records = records.filter(r => r.id !== id);
  await delPhotoDB(id).catch(() => {});
  photoCache.delete(id);
  invalidateAll();
  storeRecords();
  scheduleRender(); // RAF-deduped, non-blocking
}


// ════════════════════════════════════════════════════════════
// 8. SAVE / UPDATE
// ════════════════════════════════════════════════════════════
$("saveBtn").onclick = async () => {
  const barcode = ($("barcode").value || "").trim();
  const qty     = Number($("qty").value);
  const expiry  = $("expiry").value;
  const mfg     = $("mfg").value;

  if (!barcode) {
    showMsg("Nhap hoac quet Barcode truoc!", false);
    $("barcode").focus(); return;
  }
  if (!qty || qty < 1) {
    showMsg("So luong phai lon hon 0!", false); return;
  }
  if (!expiry) {
    showMsg("Chon Han su dung!", false);
    $("expiry").focus(); return;
  }
  if (mfg && expiry && mfg > expiry) {
    showMsg("Ngay san xuat khong the sau Han su dung!", false); return;
  }

  stopScan();
  const origLabel       = $("saveBtn").textContent;
  $("saveBtn").disabled = true;
  $("saveBtn").innerHTML = '<span class="spinner"></span>Dang luu...';

  try {
    const isEdit   = !!editingId;
    const id       = isEdit ? editingId : genId();
    const existing = isEdit ? records.find(r => r.id === editingId) : null;

    // Determine photo state for this record
    let hasPhoto;
    if (photoRemoved) {
      hasPhoto = false;
      await delPhotoDB(id).catch(() => {});
      photoCache.delete(id);
    } else if (photoData) {
      // Save photo (new upload or existing loaded into photoData)
      hasPhoto = true;
      await savePhotoDB(id, photoData);
      cacheSet(id, photoData); // LRU cache
    } else {
      // No change to photo state
      hasPhoto = isEdit ? (existing?.hasPhoto || false) : false;
    }

    const rec = {
      id,
      barcode,
      name:      ($("pName").value || "").trim(),
      qty,
      mfg:       mfg || "",
      expiry,
      note:      ($("note").value || "").trim(),
      hasPhoto,
      createdAt: existing?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    if (isEdit) {
      records = records.map(r => r.id === editingId ? rec : r);
    } else {
      records.push(rec);
    }

    invalidateAll();    // mark both caches dirty
    storeRecords();     // deferred via queueMicrotask — does not block paint
    clearForm();
    await render();
    showMsg(isEdit ? "Cap nhat thanh cong!" : "Da luu! Bam quet de tiep tuc.", true);
  } catch(err) {
    console.error("Save error:", err);
    showMsg("Loi khi luu: " + err.message, false);
  } finally {
    $("saveBtn").disabled    = false;
    $("saveBtn").textContent = origLabel;
  }
};

$("clearBtn").onclick = () => { clearForm(); showMsg("Da xoa form."); };

// ════════════════════════════════════════════════════════════
// 10. SCANNER — fixed lifecycle (no stale instance)
// ════════════════════════════════════════════════════════════
async function startScan() {
  if (isStarting) return; // race-condition guard

  isStarting = true;
  $("scanBtn").disabled = true;
  $("stopBtn").classList.remove("hidden");
  $("reader").classList.remove("hidden");
  showMsg("Dang ket noi camera...");

  try {
    // Always create a fresh instance (old one may be in broken state)
    html5QrCode = new Html5Qrcode("reader");

    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: { width: 270, height: 170 },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      },
      decodedText => {
        $("barcode").value = decodedText;
        showMsg("Da nhan: " + decodedText, true);
        navigator.vibrate?.(100);
        stopScan();
        $("expiry").focus();
      },
      () => {} // Per-frame errors — suppress (normal during scanning)
    );

    showMsg("Dua barcode vao khung ngam...");
  } catch(err) {
    console.error("Camera error:", err);
    showMsg("Khong the mo camera. Kiem tra quyen camera trong trinh duyet.", false);
    await stopScan();
  } finally {
    isStarting = false; // always release guard
  }
}

async function stopScan() {
  try {
    if (html5QrCode) {
      if (html5QrCode.isScanning) await html5QrCode.stop();
      html5QrCode.clear?.();
      html5QrCode = null; // reset so next scan gets fresh instance
    }
  } catch(e) {
    html5QrCode = null;
  } finally {
    // Cleanup always runs, even if stop() throws
    $("reader").classList.add("hidden");
    $("stopBtn").classList.add("hidden");
    $("scanBtn").disabled = false;
  }
}

$("scanBtn").onclick   = startScan;
$("stopBtn").onclick   = stopScan;
$("manualBtn").onclick = () => { stopScan(); $("barcode").focus(); };

// Debounced search — 300 ms, only dirties filter cache (not stats)
$("search").oninput = debounce(() => {
  invalidateFilter();
  scheduleRender(true); // reset to page 1, RAF-deduped
}, 300);

$("csvBtn").onclick = () => {

    "Barcode","Ten san pham","So luong","Ngay san xuat",

// ════════════════════════════════════════════════════════════
// 12. EXPORT XLSX with embedded photos  (ExcelJS, lazy-loaded)
// ════════════════════════════════════════════════════════════
let _excelJSLoaded = false;
function loadExcelJS() {
  if (_excelJSLoaded || typeof ExcelJS !== "undefined") {
    _excelJSLoaded = true;
    return Promise.resolve();
  }
  return new Promise((resolve, reject) => {
    const s   = document.createElement("script");
    s.src     = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
    s.onload  = () => { _excelJSLoaded = true; resolve(); };
    s.onerror = () => reject(new Error("Khong tai duoc ExcelJS. Kiem tra ket noi mang."));
    document.head.appendChild(s);
  });
}

$("xlsxBtn").onclick = async () => {
  if (!records.length) { showMsg("Chua co du lieu de xuat!", false); return; }

  $("xlsxBtn").disabled  = true;
  $("xlsxBtn").innerHTML = '<span class="spinner"></span>Dang tai thu vien...';

  try {
    await loadExcelJS();
    $("xlsxBtn").innerHTML = '<span class="spinner"></span>Dang tao file Excel...';

    const wb = new ExcelJS.Workbook();
    wb.creator  = "Barcode Manager";
    wb.created  = new Date();
    wb.modified = new Date();

    const ws = wb.addWorksheet("Du lieu Barcode", {
      views:     [{ state: "frozen", ySplit: 1 }],
      pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true }
    });

    // ── Column definitions ───────────────────────────────
    ws.columns = [
      { header: "Barcode",       key: "barcode",  width: 22 },
      { header: "Ten san pham",  key: "name",     width: 30 },
      { header: "So luong",      key: "qty",      width: 12 },
      { header: "Ngay san xuat", key: "mfg",      width: 16 },
      { header: "Han su dung",   key: "expiry",   width: 16 },
      { header: "Trang thai",    key: "status",   width: 16 },
      { header: "Ghi chu",       key: "note",     width: 30 },
      { header: "Thoi gian tao", key: "created",  width: 22 },
      { header: "Anh san pham",  key: "photo",    width: 20 },
    ];

    // ── Header row style ─────────────────────────────────
    const hdrRow = ws.getRow(1);
    hdrRow.height = 30;
    hdrRow.eachCell(cell => {
      cell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1A3F63" } };
      cell.font      = { color: { argb: "FFFFFFFF" }, bold: true, size: 11, name: "Calibri" };
      cell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
      cell.border    = { bottom: { style: "medium", color: { argb: "FF2E75B6" } } };
    });

    // ── Fetch all photos in parallel ─────────────────────
    const withPhotos = records.filter(r => r.hasPhoto);
    const photos     = withPhotos.length
      ? await fetchPhotos(withPhotos.map(r => r.id)) : {};

    // ── Data rows ────────────────────────────────────────
    for (let i = 0; i < records.length; i++) {
      const r       = records[i];
      const s       = stat(r);
      const photo   = photos[r.id] || null;
      const excelRN = i + 2; // Excel row number (header = row 1)

      const row = ws.addRow({
        barcode: r.barcode,
        name:    r.name   || "",
        qty:     r.qty,
        mfg:     r.mfg   || "",
        expiry:  r.expiry || "",
        status:  s[0],
        note:    r.note   || "",
        created: r.createdAt
          ? new Date(r.createdAt).toLocaleString("vi-VN") : "",
        photo:   "" // image embedded via ws.addImage; cell left empty
      });

      row.height = photo ? 75 : 22;

      // Base cell styles for this row
      row.eachCell({ includeEmpty: true }, cell => {
        cell.alignment = { vertical: "middle", wrapText: true };
        cell.font      = { name: "Calibri", size: 10 };
        cell.border    = {
          top:    { style: "thin", color: { argb: "FFD0DCE8" } },
          left:   { style: "thin", color: { argb: "FFD0DCE8" } },
          bottom: { style: "thin", color: { argb: "FFD0DCE8" } },
          right:  { style: "thin", color: { argb: "FFD0DCE8" } }
        };
        // Alternate row shading
        if (i % 2 === 1) {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF3F7FB" } };
        }
      });

      // Qty — center align
      row.getCell(3).alignment = { vertical: "middle", horizontal: "center" };

      // Status cell — colour-coded by expiry state
      const statusCell = row.getCell(6);
      statusCell.alignment = { vertical: "middle", horizontal: "center" };
      statusCell.font      = { name: "Calibri", size: 10, bold: true };
      if (s[1] === "expired") {
        statusCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFDE0DF" } };
        statusCell.font = { ...statusCell.font, color: { argb: "FF7A1010" } };
      } else if (s[1] === "soon") {
        statusCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFCE4D6" } };
        statusCell.font = { ...statusCell.font, color: { argb: "FF7A3010" } };
      } else {
        statusCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2F0D9" } };
        statusCell.font = { ...statusCell.font, color: { argb: "FF2A5219" } };
      }

      // ── Embed photo in column I (index 8, 0-based) ───
      if (photo) {
        const ext   = photo.startsWith("data:image/png") ? "png" : "jpeg";
        const b64   = photo.split(",")[1];
        const imgId = wb.addImage({ base64: b64, extension: ext });
        // ExcelJS image coords: tl/br row/col are 0-indexed
        // row 0 = header; first data row = index (excelRN - 1)
        ws.addImage(imgId, {
          tl:     { col: 8, row: excelRN - 1 },
          br:     { col: 9, row: excelRN },
          editAs: "oneCell"
        });
      }
    }

    // ── Write buffer & trigger download ──────────────────
    const buffer = await wb.xlsx.writeBuffer();
    download(
      new Blob([buffer], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      }),
      `barcode_${fmtDate()}.xlsx`
    );
    showMsg("Xuat Excel thanh cong!", true);

  } catch(err) {
    console.error("XLSX export error:", err);
    showMsg("Loi xuat Excel: " + err.message, false);
  } finally {
    $("xlsxBtn").disabled    = false;
    $("xlsxBtn").textContent = "&#128202; Xuat Excel (co anh)";
  }
};


// ════════════════════════════════════════════════════════════
// 13. BACKUP / RESTORE JSON
//     Backup includes photos so the .json is self-contained
// ════════════════════════════════════════════════════════════
$("jsonBtn").onclick = async () => {
  $("jsonBtn").disabled  = true;
  $("jsonBtn").innerHTML = '<span class="spinner spinner-dark"></span>Dang sao luu...';
  try {
    const withPhotos = records.filter(r => r.hasPhoto);
    const photos     = withPhotos.length
      ? await fetchPhotos(withPhotos.map(r => r.id)) : {};
    const backup = {
      version:    3,
      exportedAt: new Date().toISOString(),
      records,
      photos // base64 photos included for portability
    };
    download(
      new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }),
      `barcode_backup_${fmtDate()}.json`
    );
    showMsg("Sao luu thanh cong!", true);
  } catch(err) {
    showMsg("Loi sao luu: " + err.message, false);
  } finally {
    $("jsonBtn").disabled    = false;
    $("jsonBtn").textContent = "&#128190; Sao luu JSON";
  }
};

$("restoreBtn").onclick = () => $("restoreInput").click();

$("restoreInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  if (!confirm(
    "Khoi phuc se GHI DE toan bo " + records.length + " ban ghi hien tai.\nBan chac chan muon tiep tuc?"
  )) { e.target.value = ""; return; }

  $("restoreBtn").disabled  = true;
  $("restoreBtn").innerHTML = '<span class="spinner spinner-dark"></span>Dang khoi phuc...';

  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (Array.isArray(data)) {
      // Legacy v1/v2 — photos were stored directly on records
      const migrated     = [];
      const photoEntries = [];
      for (const r of data) {
        const id = r.id || genId();
        if (r.photo) {
          photoEntries.push([id, r.photo]);
          cacheSet(id, r.photo); // populate cache immediately
        }
        migrated.push({
          id,
          barcode:   r.barcode  || "",
          name:      r.name     || "",
          qty:       r.qty      || 1,
          mfg:       r.mfg      || "",
          expiry:    r.expiry   || "",
          note:      r.note     || "",
          hasPhoto:  !!r.photo,
          createdAt: r.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      // Write photos in parallel batches of 20 — NOT sequential await-in-loop
      await batchSavePhotos(photoEntries);
      records = migrated;
    } else {
      // v3 format
      records = data.records || [];
      const photos       = data.photos || {};
      const photoEntries = Object.entries(photos);
      // Populate cache immediately → render shows photos without waiting for IDB
      for (const [id, url] of photoEntries) cacheSet(id, url);
      // Write to IDB in the background (non-blocking for UI)
      batchSavePhotos(photoEntries).catch(console.error);
    }

    invalidateAll();
    storeRecords();
    await render();
    showMsg("Khoi phuc thanh cong! " + records.length + " ban ghi.", true);
  } catch(err) {
    showMsg("File khong hop le: " + err.message, false);
  } finally {
    e.target.value = "";
    $("restoreBtn").disabled    = false;
    $("restoreBtn").textContent = "&#9851;&#65039; Khoi phuc";
  }
};


// ════════════════════════════════════════════════════════════
// 14. RESET ALL DATA
// ════════════════════════════════════════════════════════════
function clearAllPhotosDB() {

}

$("resetBtn").onclick = async () => {

    showMsg("Khong co du lieu de xoa.", false); return;

  // Double-confirm to prevent accidents
  if (!confirm("XOA TOAN BO " + records.length + " ban ghi va tat ca anh?\n\nHanh dong nay KHONG THE hoan tac!")) return;
  if (!confirm("Xac nhan lan 2: Toan bo du lieu se bi xoa vinh vien. Tiep tuc?")) return;

  $("resetBtn").innerHTML = '<span class="spinner"></span>Dang xoa...';

  try {
    records = [];
    localStorage.removeItem(LS_KEY);

    photoCache.clear();
    invalidateAll();
    clearForm();
    await render();

  } catch(err) {
    showMsg("Loi reset: " + err.message, false);
  } finally {
    $("resetBtn").disabled    = false;
    $("resetBtn").textContent = "&#128465; Xoa toan bo du lieu";
  }
};


// ════════════════════════════════════════════════════════════
// 15. INIT — auto-migrates v2 localStorage → v3 (IndexedDB)
// ════════════════════════════════════════════════════════════
async function init() {
  const oldRaw = localStorage.getItem(LS_KEY_V2);
  const newRaw = localStorage.getItem(LS_KEY);

  if (oldRaw && !newRaw) {
    // One-time migration from v2
    try {
      const oldRecs      = JSON.parse(oldRaw);
      const migrated     = [];
      const photoEntries = [];
      for (const r of oldRecs) {
        const id = genId();
        if (r.photo) {
          photoEntries.push([id, r.photo]);
          cacheSet(id, r.photo);
        }
        migrated.push({
          id,
          barcode:   r.barcode  || "",
          name:      r.name     || "",
          qty:       r.qty      || 1,
          mfg:       r.mfg      || "",
          expiry:    r.expiry   || "",
          note:      r.note     || "",
          hasPhoto:  !!r.photo,
          createdAt: r.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      await batchSavePhotos(photoEntries); // parallel batch write
      records = migrated;
      invalidateAll();
      storeRecords();
      showMsg("Da chuyen " + records.length + " ban ghi tu phien ban cu!", true);
    } catch(e) {
      console.error("Migration failed:", e);
      loadRecords();
    }
  } else {
    loadRecords();
  }

  await render();
}

init();
