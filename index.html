<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3f63">
<title>Quản lý Barcode Mobile</title>
<meta name="description" content="Ứng dụng quản lý barcode sản phẩm, hạn sử dụng, ảnh chụp và xuất/nhập Excel.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f4f8;color:#17202a}
header{background:linear-gradient(135deg,#1a3f63 0%,#2e75b6 100%);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 3px 16px rgba(31,78,120,.35)}
h1{font-size:21px;margin:0 0 3px;letter-spacing:-.3px}
.sub{font-size:12px;opacity:.75;letter-spacing:.2px}
main{padding:12px;max-width:700px;margin:auto}

/* Cards */
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.07)}

/* Labels & Inputs */
label{display:block;font-weight:700;font-size:12px;margin:12px 0 5px;color:#2c3e50;text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%;font:inherit;border-radius:12px;border:1.5px solid #d0d9e4;
  padding:12px 14px;background:#fff;transition:border-color .2s,box-shadow .2s;color:#17202a}
input:focus,textarea:focus{outline:none;border-color:#2e75b6;box-shadow:0 0 0 3px rgba(46,117,182,.12)}
input[type=file]{
  width:100%;font:inherit;border-radius:12px;border:1.5px dashed #adc4db;
  padding:10px 14px;background:#f5f9ff;color:#3a5a78;cursor:pointer}
textarea{resize:vertical}

/* Buttons */
button{
  width:100%;font:inherit;border:0;border-radius:12px;padding:13px;
  cursor:pointer;font-weight:700;font-size:14px;
  transition:opacity .15s,transform .1s,box-shadow .2s;letter-spacing:.1px}
button:active:not(:disabled){opacity:.82;transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#1f4e78,#2e75b6);color:#fff;box-shadow:0 4px 12px rgba(31,78,120,.32)}
.btn-green{background:linear-gradient(135deg,#439626,#58a336);color:#fff;box-shadow:0 4px 10px rgba(67,150,38,.32)}
.btn-orange{background:#f0a070;color:#fff}
.btn-gray{background:#e4ecf2;color:#2c3e50}
.btn-excel{background:linear-gradient(135deg,#1a5c38,#217346);color:#fff;box-shadow:0 4px 10px rgba(33,115,70,.30)}
.btn-csv{background:linear-gradient(135deg,#5a4e99,#7b6fc4);color:#fff;box-shadow:0 4px 10px rgba(90,78,153,.30)}
.btn-backup{background:linear-gradient(135deg,#2a6080,#3a80a8);color:#fff}
.btn-restore{background:#e4ecf2;color:#2c3e50}
.btn-danger{background:linear-gradient(135deg,#a31515,#c0392b);color:#fff;box-shadow:0 4px 10px rgba(192,57,43,.32)}
.btn-remove-photo{background:#fdecea;color:#c0392b;border:1.5px solid #f1c0bb !important;padding:8px !important;font-size:12px;border-radius:9px !important}

/* Grids */
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:linear-gradient(135deg,#eef4fb,#e0ecf7);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:#1f4e78;font-weight:800;line-height:1.1}
.stat .slabel{color:#5a7a98;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* Scanner */
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-top:10px;min-height:180px}

/* Status bar */
.status{padding:10px 14px;border-radius:11px;background:#eef4fb;font-size:13px;
  margin-top:10px;font-weight:600;text-align:center;transition:background .3s,color .3s}

/* Edit banner */
.edit-banner{background:#fff8ec;border:2px solid #f0a070;border-radius:12px;
  padding:9px 13px;font-size:13px;font-weight:700;color:#7a4000;margin-bottom:12px;
  display:flex;align-items:center;gap:7px}

/* Photo preview */
.preview-wrap{margin-top:8px}
.preview-img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;
  border:1.5px solid #d0dde8;display:block}

/* List items */
.item{border:1.5px solid #e4ecf2;border-radius:14px;padding:13px;margin-top:9px;
  background:#fff;transition:box-shadow .2s,border-color .2s;will-change:box-shadow}
.item:hover{box-shadow:0 4px 16px rgba(31,78,120,.09);border-color:#c4d4e4}
.item strong{display:block;font-size:15px;color:#17202a;margin-bottom:3px}
.muted{font-size:12px;color:#68737d;margin-top:2px;line-height:1.6}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;
  font-weight:800;margin-top:6px;letter-spacing:.3px}
.ok{background:#e2f0d9;color:#2a5219}
.soon{background:#fce4d6;color:#7a3010}
.expired{background:#fde0df;color:#7a1010}

/* Photo thumbnail */
.photo-thumb{width:78px;height:78px;object-fit:cover;border-radius:9px;
  margin-top:8px;display:block;border:1.5px solid #d8e5ef;content-visibility:auto}

/* Spinner */
.spinner{display:inline-block;width:13px;height:13px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .55s linear infinite;
  vertical-align:middle;margin-right:5px}
.spinner-dark{border-color:rgba(44,62,80,.25);border-top-color:#2c3e50}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.page-btn{min-width:36px;height:36px;padding:0 8px;border-radius:10px;font-size:13px;
  font-weight:700;border:1.5px solid #d0dde8;background:#fff;color:#1f4e78;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.page-btn:hover:not(:disabled){background:#eef4fb;border-color:#2e75b6}
.page-btn.active{background:linear-gradient(135deg,#1f4e78,#2e75b6);color:#fff;border-color:#1f4e78}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
.page-info{font-size:12px;color:#5a7a98;font-weight:600;padding:0 4px}

/* Utilities */
.hidden{display:none !important}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
</style>

<!-- Html5Qrcode Scanner (loaded synchronously — needed right away for camera) -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<header>
  <h1>Quản lý Barcode Mobile</h1>
  <div class="sub">Quét mã, lưu kho, gợi ý tên, ảnh chụp &amp; xuất/nhập Excel</div>
</header>

<main>

  <!-- Summary Stats -->
  <section class="card">
    <div class="stats">
      <div class="stat"><b id="totalRows">0</b><div class="slabel">Mặt hàng</div></div>
      <div class="stat"><b id="totalQty">0</b><div class="slabel">Tổng SL</div></div>
      <div class="stat"><b id="expiredCount" style="color:#c0392b">0</b><div class="slabel">Hết hạn</div></div>
    </div>
  </section>

  <!-- Scanner -->
  <section class="card">
    <div class="actions">
      <button class="btn-primary" id="scanBtn">&#128247; Quét mã Camera</button>
      <button class="btn-gray"    id="manualBtn">&#9999;&#65039; Nhập Barcode tay</button>
    </div>
    <div id="reader" class="hidden"></div>
    <div class="mt8">
      <button class="btn-orange hidden" id="stopBtn">&#9209; Dừng camera</button>
    </div>
    <div class="status" id="scanStatus">Sẵn sàng. Bấm nút để mở camera.</div>
  </section>

  <!-- Form -->
  <section class="card" id="formCard">
    <div id="editBanner" class="edit-banner hidden">&#9999;&#65039; Đang chỉnh sửa &mdash; bấm Cập nhật để lưu</div>

    <label>Barcode *</label>
    <input id="barcode" type="text" inputmode="numeric" autocomplete="off"
           placeholder="Barcode tự điền khi quét hoặc nhập tay">

    <label>Tên sản phẩm</label>
    <input id="pName" type="text" placeholder="Tên sản phẩm (tự điền nếu đã từng lưu)" list="pNameSuggestions">
    <datalist id="pNameSuggestions"></datalist>

    <div class="row">
      <div>
        <label>Số lượng *</label>
        <input id="qty" type="number" inputmode="numeric" min="1" value="1">
      </div>
      <div>
        <label>Hạn sử dụng *</label>
        <input id="expiry" type="date">
      </div>
    </div>

    <label>Ngày sản xuất</label>
    <input id="mfg" type="date">

    <label>Ảnh sản phẩm</label>
    <input id="photoInput" type="file" accept="image/*" capture="environment">
    <div id="photoPreviewWrap" class="preview-wrap hidden">
      <img id="photoPreview" class="preview-img" src="" alt="Xem trước ảnh">
      <button class="btn-remove-photo mt8" id="removePhotoBtn">&#128465; Xóa ảnh</button>
    </div>

    <label>Ghi chú</label>
    <textarea id="note" rows="2" placeholder="Ghi chú thêm..."></textarea>

    <div class="actions mt12">
      <button class="btn-green" id="saveBtn">&#128190; Lưu</button>
      <button class="btn-orange" id="clearBtn">&#129529; Xóa form</button>
    </div>
  </section>

  <!-- List & Export / Import -->
  <section class="card">
    <label>&#128269; Tìm kiếm</label>
    <input id="search" type="text" placeholder="Barcode hoặc tên sản phẩm...">
    <div id="list"></div>
    <div id="pagination"></div>

    <div class="row mt12">
      <button class="btn-excel" id="xlsxBtn">&#128202; Xuất Excel (có ảnh)</button>
      <button class="btn-green" id="importXlsxBtn">&#128229; Nhập Excel / CSV</button>
    </div>
    <div class="row mt8">
      <button class="btn-csv"   id="csvBtn">&#128196; Xuất CSV</button>
      <button class="btn-backup"  id="jsonBtn">&#128190; Sao lưu JSON</button>
    </div>
    <div class="row mt8">
      <button class="btn-restore" id="restoreBtn" style="grid-column: span 2;">&#9851;&#65039; Khôi phục JSON</button>
    </div>
    <input id="importXlsxInput" type="file" accept=".xlsx,.xls,.csv" class="hidden">
    <input id="restoreInput" type="file" accept=".json" class="hidden">
    <hr style="border:0;border-top:1.5px dashed #e4ecf2;margin:14px 0">
    <button class="btn-danger" id="resetBtn">&#128465; Xóa toàn bộ dữ liệu</button>
  </section>

</main>

<script>
"use strict";

// ════════════════════════════════════════════════════════════
// 1. CONSTANTS & STATE
// ════════════════════════════════════════════════════════════
const LS_KEY         = "barcode_v3";
const LS_KEY_V2      = "barcode_inventory_v2"; // legacy key for migration
const LS_KEY_CATALOG = "barcode_catalog_v1";   // Barcode -> Product Name dictionary

let records      = [];     // metadata only — no photo blobs here
let catalog      = {};     // barcode -> product_name (O(1) in-memory lookup table)
let html5QrCode  = null;   // scanner instance
let isStarting   = false;  // race-condition guard for startScan()
let photoData    = "";     // base64 of current form photo (or "" if none)
let photoRemoved = false;  // true when user explicitly clicked "Xoa anh"
let editingId    = "";     // UUID of record being edited ("" = creating new)

// ── Incremental stats cache — avoid full-scan on every render ──
let _statsCache = { total: 0, qty: 0, expired: 0, dirty: true };

// ── Filter result cache — avoid re-filtering on every keystroke ──
let _filterCache = { q: null, result: null, dirty: true };

// ── RAF render dedup — collapse multiple rapid scheduleRender() calls ──
let _renderPending   = false;
let _renderResetPage = false;

// LRU photo cache — evicts oldest when > MAX_CACHE entries
// Prevents RAM from growing unbounded with 1000+ photos
const MAX_CACHE  = 80;
const photoCache = new Map(); // id -> dataUrl (insertion-order = LRU)

function cacheSet(id, url) {
  if (photoCache.has(id)) photoCache.delete(id); // refresh position
  photoCache.set(id, url);
  if (photoCache.size > MAX_CACHE) photoCache.delete(photoCache.keys().next().value);
}

function cacheGet(id) {
  if (!photoCache.has(id)) return undefined;
  const url = photoCache.get(id);
  photoCache.delete(id); // move to end (most-recently-used)
  photoCache.set(id, url);
  return url;
}

// Pagination state
const PAGE_SIZE     = 50;
let currentPage     = 1;
let filteredTotal   = 0;

const $ = id => document.getElementById(id);


// ════════════════════════════════════════════════════════════
// 2. INDEXEDDB — stores all photo blobs
// ════════════════════════════════════════════════════════════
const IDB_NAME    = "barcode_photos_v3";
const IDB_STORE   = "photos";
const IDB_VERSION = 1;

let _dbPromise = null;

function getDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
  return _dbPromise;
}

async function idbOp(mode, fn) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(IDB_STORE, mode);
    const store = tx.objectStore(IDB_STORE);
    let req;
    try { req = fn(store); } catch(err) { reject(err); return; }
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror    = () => reject(tx.error);
    tx.onabort    = () => reject(tx.error);
  });
}

function savePhotoDB(id, dataUrl) {
  return idbOp("readwrite", s => s.put({ id, dataUrl }));
}

function getPhotoDB(id) {
  return idbOp("readonly", s => s.get(id)).then(row => row ? row.dataUrl : null);
}

function delPhotoDB(id) {
  return idbOp("readwrite", s => s.delete(id));
}

// Parallel fetch for multiple photos with cache checking
async function fetchPhotos(ids) {
  const result  = {};
  const missing = [];

  for (const id of ids) {
    const cached = cacheGet(id);
    if (cached !== undefined) {
      result[id] = cached;
    } else {
      missing.push(id);
    }
  }

  if (missing.length) {
    const loaded = await Promise.all(
      missing.map(id => getPhotoDB(id).catch(() => null))
    );
    for (let i = 0; i < missing.length; i++) {
      const url = loaded[i];
      if (url) {
        cacheSet(missing[i], url);
        result[missing[i]] = url;
      }
    }
  }

  return result;
}

// Write photos in parallel batches of N (avoids overloading IDB with 1000+ writes)
async function batchSavePhotos(entries, batchSize = 20) {
  for (let i = 0; i < entries.length; i += batchSize) {
    await Promise.all(
      entries.slice(i, i + batchSize).map(([id, url]) => savePhotoDB(id, url))
    );
  }
}


// ════════════════════════════════════════════════════════════
// 3. LOCALSTORAGE — record metadata (no photos)
// ════════════════════════════════════════════════════════════
function loadRecords() {
  try { records = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
  catch { records = []; }
  invalidateAll();
}

// Defer localStorage write off the critical render path via microtask
let _storePending = false;
function storeRecords() {
  if (_storePending) return;
  _storePending = true;
  queueMicrotask(() => {
    _storePending = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(records)); }
    catch(e) { alert("Lỗi lưu dữ liệu: " + e.message); }
  });
}


// ════════════════════════════════════════════════════════════
// 3.5. PRODUCT CATALOG — auto-remembers barcode -> product name
// ════════════════════════════════════════════════════════════
function loadCatalog() {
  try { catalog = JSON.parse(localStorage.getItem(LS_KEY_CATALOG) || "{}"); }
  catch { catalog = {}; }

  // Sync catalog from existing records
  let updated = false;
  for (const r of records) {
    if (r.barcode && r.name && !catalog[r.barcode]) {
      catalog[r.barcode] = r.name;
      updated = true;
    }
  }
  if (updated) storeCatalog();
  updateSuggestions();
}

let _catalogStorePending = false;
function storeCatalog() {
  if (_catalogStorePending) return;
  _catalogStorePending = true;
  queueMicrotask(() => {
    _catalogStorePending = false;
    try { localStorage.setItem(LS_KEY_CATALOG, JSON.stringify(catalog)); }
    catch (e) { console.warn("Lỗi lưu danh mục tên sản phẩm:", e); }
  });
}

function saveCatalogItem(barcode, name) {
  const b = (barcode || "").trim();
  const n = (name || "").trim();
  if (!b || !n) return;
  if (catalog[b] !== n) {
    catalog[b] = n;
    storeCatalog();
    updateSuggestions();
  }
}

function lookupCatalog(barcode) {
  const b = (barcode || "").trim();
  if (!b) return "";
  return catalog[b] || "";
}

function updateSuggestions() {
  const dl = $("pNameSuggestions");
  if (!dl) return;
  // Keep DOM lightweight: max 100 unique product names in datalist
  const unique = Array.from(new Set(Object.values(catalog))).slice(0, 100);
  dl.innerHTML = unique.map(n => `<option value="${esc(n)}"></option>`).join("");
}


// ════════════════════════════════════════════════════════════
// 4. CACHE INVALIDATION HELPERS
// ════════════════════════════════════════════════════════════
function invalidateAll() {
  _statsCache.dirty  = true;
  _filterCache.dirty = true;
}

function invalidateFilter() {
  _filterCache.dirty = true;
}

// Compute stats only once per data change (O(n) single pass)
function getStats() {
  if (!_statsCache.dirty) return _statsCache;
  let qty = 0, expired = 0;
  const today = new Date();
  for (const r of records) {
    qty += Number(r.qty || 0);
    if (r.expiry) {
      const days = Math.ceil((new Date(r.expiry + "T23:59:59") - today) / 86400000);
      if (days < 0) expired++;
    }
  }
  _statsCache = { total: records.length, qty, expired, dirty: false };
  return _statsCache;
}

// Compute filtered list only when query or data changes
function getFiltered(q) {
  if (!_filterCache.dirty && _filterCache.q === q) return _filterCache.result;
  const lq     = q.toLowerCase();
  const result = lq
    ? records.filter(r => (r.barcode + " " + (r.name || "")).toLowerCase().includes(lq)).slice().reverse()
    : records.slice().reverse();
  _filterCache = { q, result, dirty: false };
  return result;
}


// ════════════════════════════════════════════════════════════
// 5. UTILITIES
// ════════════════════════════════════════════════════════════
function genId() {
  return typeof crypto.randomUUID === "function"
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g,
    m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

function showMsg(msg, ok = true) {
  const el = $("scanStatus");
  el.textContent      = msg;
  el.style.background = ok ? "#dff2d8" : "#fde8e4";
  el.style.color      = ok ? "#27582a" : "#8a1c1c";
}

function stat(r) {
  if (!r.expiry) return ["CÒN HẠN", "ok"];
  const days = Math.ceil((new Date(r.expiry + "T23:59:59") - new Date()) / 86400000);
  if (days < 0)  return ["ĐÃ HẾT HẠN", "expired"];
  if (days <= 7) return ["SẮP HẾT HẠN", "soon"];
  return ["CÒN HẠN", "ok"];
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function compressImage(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const w = Math.min(img.width, maxW);
        const h = img.height * (w / img.width);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.68));
      };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(file);
  });
}

function download(blob, name) {
  const a    = document.createElement("a");
  a.href     = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  requestAnimationFrame(() => URL.revokeObjectURL(a.href));
}

function fmtDate() {
  return new Date().toISOString().slice(0, 10);
}


// ════════════════════════════════════════════════════════════
// 6. RENDER — cached stats+filter, paginated, RAF-deduped
// ════════════════════════════════════════════════════════════
function scheduleRender(resetPage = false) {
  if (resetPage) _renderResetPage = true;
  if (_renderPending) return;
  _renderPending = true;
  requestAnimationFrame(() => {
    _renderPending    = false;
    const doReset     = _renderResetPage;
    _renderResetPage  = false;
    _doRender(doReset);
  });
}

async function _doRender(resetPage = false) {
  // Stats (cached)
  const s = getStats();
  $("totalRows").textContent    = s.total;
  $("totalQty").textContent     = s.qty;
  $("expiredCount").textContent = s.expired;

  // Filter (cached)
  const q        = ($("search").value || "").toLowerCase();
  const filtered = getFiltered(q);

  filteredTotal = filtered.length;

  if (!filteredTotal) {
    $("list").innerHTML = `<div class="muted" style="padding:14px 0 4px;text-align:center">
      Chưa có dữ liệu. Quét hoặc nhập barcode để bắt đầu.</div>`;
    renderPagination(0);
    return;
  }

  if (resetPage) currentPage = 1;
  const totalPages = Math.ceil(filteredTotal / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;

  const start     = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  // Single DOM write (one reflow)
  const parts = new Array(pageItems.length);
  for (let i = 0; i < pageItems.length; i++) {
    const r      = pageItems[i];
    const st     = stat(r);
    const safeId = esc(r.id);
    parts[i] = `<div class="item">
      <strong>${esc(r.name || "Chưa đặt tên")}</strong>
      <div class="muted">&#128278; <b>${esc(r.barcode)}</b> &nbsp;&middot;&nbsp; SL: <b>${esc(r.qty)}</b> &nbsp;&middot;&nbsp; HSD: ${esc(r.expiry || "&#8212;")}</div>
      ${r.mfg  ? `<div class="muted">&#127981; NSX: ${esc(r.mfg)}</div>` : ""}
      ${r.note ? `<div class="muted">&#128221; ${esc(r.note)}</div>`     : ""}
      <span class="badge ${st[1]}">${st[0]}</span>
      ${r.hasPhoto ? `<img id="img_${safeId}" class="photo-thumb" src="" alt="ảnh" loading="lazy" decoding="async">` : ""}
      <div class="actions" style="margin-top:9px">
        <button class="btn-gray" onclick="editR('${safeId}')">&#9999;&#65039; Sửa</button>
        <button class="btn-gray" onclick="delR('${safeId}')">&#128465; Xóa</button>
      </div>
    </div>`;
  }
  $("list").innerHTML = parts.join("");

  renderPagination(totalPages);

  // Lazy-load photos for current page only
  const withPhotos = pageItems.filter(r => r.hasPhoto);
  if (withPhotos.length) {
    const photos = await fetchPhotos(withPhotos.map(r => r.id));
    requestAnimationFrame(() => {
      for (const r of withPhotos) {
        const el = document.getElementById("img_" + r.id);
        if (el && photos[r.id]) el.src = photos[r.id];
      }
    });
  }
}

async function render(resetPage = false) {
  return _doRender(resetPage);
}

function renderPagination(totalPages) {
  const el = $("pagination");
  if (totalPages <= 1) { el.innerHTML = ""; return; }

  let h = `<div class="pagination">
    <button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>&laquo;</button>`;

  const maxVisible = 5;
  let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let end   = Math.min(totalPages, start + maxVisible - 1);
  if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

  if (start > 1) {
    h += `<button class="page-btn" onclick="goPage(1)">1</button>`;
    if (start > 2) h += `<span class="page-info">&hellip;</span>`;
  }

  for (let p = start; p <= end; p++) {
    h += `<button class="page-btn ${p === currentPage ? "active" : ""}" onclick="goPage(${p})">${p}</button>`;
  }

  if (end < totalPages) {
    if (end < totalPages - 1) h += `<span class="page-info">&hellip;</span>`;
    h += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  }

  h += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>&raquo;</button>
    <span class="page-info">${currentPage}/${totalPages} (${filteredTotal} mục)</span>
  </div>`;

  el.innerHTML = h;
}

async function goPage(p) {
  const totalPages = Math.ceil(filteredTotal / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  await render();
  $("search").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ════════════════════════════════════════════════════════════
$("saveBtn").onclick = async () => {
  const barcode = ($("barcode").value || "").trim();
  const qty     = Number($("qty").value);
  const expiry  = $("expiry").value;
  const mfg     = $("mfg").value;

  if (!barcode) {
    showMsg("Nhập hoặc quét Barcode trước!", false);
    $("barcode").focus(); return;
  }
  if (!qty || qty < 1) {
    showMsg("Số lượng phải lớn hơn 0!", false); return;
  }
  if (!expiry) {
    showMsg("Chọn Hạn sử dụng!", false);
    $("expiry").focus(); return;
  }
  if (mfg && expiry && mfg > expiry) {
    showMsg("Ngày sản xuất không thể sau Hạn sử dụng!", false); return;
  }

  stopScan();
  const origLabel       = $("saveBtn").textContent;
  $("saveBtn").disabled = true;
  $("saveBtn").innerHTML = '<span class="spinner"></span>Đang lưu...';

  try {
    const isEdit   = !!editingId;
    const id       = isEdit ? editingId : genId();
    const existing = isEdit ? records.find(r => r.id === editingId) : null;

    let hasPhoto;
    if (photoRemoved) {
      hasPhoto = false;
      await delPhotoDB(id).catch(() => {});
      photoCache.delete(id);
    } else if (photoData) {
      hasPhoto = true;
      await savePhotoDB(id, photoData);
      cacheSet(id, photoData);
    } else {
      hasPhoto = isEdit ? (existing?.hasPhoto || false) : false;
    }

    const rec = {
      id,
      barcode,
      name:      ($("pName").value || "").trim(),
      qty,
      mfg:       mfg || "",
      expiry,
      note:      ($("note").value || "").trim(),
      hasPhoto,
      createdAt: existing?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    if (isEdit) {
      records = records.map(r => r.id === editingId ? rec : r);
    } else {
      records.push(rec);
    }

    // Remember / update product name in catalog for future scans
    if (barcode && rec.name) {
      saveCatalogItem(barcode, rec.name);
    }

    invalidateAll();
    storeRecords();
    clearForm();
    await render();
    showMsg(isEdit ? "Cập nhật thành công!" : "Đã lưu! Bấm quét để tiếp tục.", true);
  } catch(err) {
    console.error("Save error:", err);
    showMsg("Lỗi khi lưu: " + err.message, false);
  } finally {
    $("saveBtn").disabled    = false;
    $("saveBtn").textContent = origLabel;
  }
};

// ════════════════════════════════════════════════════════════
async function startScan() {
  if (isStarting) return;

  isStarting = true;
  $("scanBtn").disabled = true;
  $("stopBtn").classList.remove("hidden");
  $("reader").classList.remove("hidden");
  showMsg("Đang kết nối camera...");

  try {
    html5QrCode = new Html5Qrcode("reader");

    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: { width: 270, height: 170 },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      },
      decodedText => {
        $("barcode").value = decodedText;
        navigator.vibrate?.(100);
        stopScan();

        // Auto-lookup product name from catalog
        const knownName = lookupCatalog(decodedText);
        if (knownName) {
          $("pName").value = knownName;
          showMsg("✅ Đã nhận: " + decodedText + " (" + knownName + ")", true);
          $("expiry").focus(); // Product name already known -> jump straight to expiry!
        } else {
          showMsg("✅ Đã nhận: " + decodedText + " (Sản phẩm mới)", true);
          $("pName").focus();  // New product -> focus on name input
        }
      },
      () => {}
    );

    showMsg("Đưa barcode vào khung ngắm...");
  } catch(err) {
    console.error("Camera error:", err);
    showMsg("Không thể mở camera. Kiểm tra quyền camera trong trình duyệt.", false);
    await stopScan();
  } finally {
    isStarting = false;
  }
}

async function stopScan() {
  try {
    if (html5QrCode) {
      if (html5QrCode.isScanning) await html5QrCode.stop();
      html5QrCode.clear?.();
      html5QrCode = null;
    }
  } catch(e) {
    html5QrCode = null;
  } finally {
    $("reader").classList.add("hidden");
    $("stopBtn").classList.add("hidden");
    $("scanBtn").disabled = false;
  }
}

// ════════════════════════════════════════════════════════════
// 13. IMPORT EXCEL / CSV (Optimized, non-blocking chunking)
// ════════════════════════════════════════════════════════════
function parseExcelDate(val) {
  if (!val) return "";
  if (val instanceof Date && !isNaN(val.getTime())) {
    const y = val.getFullYear();
    const m = String(val.getMonth() + 1).padStart(2, "0");
    const d = String(val.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  if (typeof val === "object" && val.text)   val = val.text;
  if (typeof val === "object" && val.result) val = val.result;
  const s = String(val).trim();
  if (!s) return "";

  // ISO YYYY-MM-DD
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
  const dmy = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if (dmy) {
    return `${dmy[3]}-${dmy[2].padStart(2, "0")}-${dmy[1].padStart(2, "0")}`;
  }

  // YYYY/MM/DD
  const ymd = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if (ymd) {
    return `${ymd[1]}-${ymd[2].padStart(2, "0")}-${ymd[3].padStart(2, "0")}`;
  }

  // Excel serial number date
  const num = Number(s);
  if (!isNaN(num) && num > 10000 && num < 90000) {
    const date = new Date(Math.round((num - 25569) * 86400 * 1000));
    if (!isNaN(date.getTime())) {
      const y = date.getUTCFullYear();
      const m = String(date.getUTCMonth() + 1).padStart(2, "0");
      const d = String(date.getUTCDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
  }
  return "";
}

function getCellValue(cell) {
  if (!cell || cell.value == null) return "";
  const v = cell.value;
  if (v instanceof Date) return v;
  if (typeof v === "object") {
    if (v.text !== undefined)   return v.text;
    if (v.result !== undefined) return v.result;
    if (Array.isArray(v.richText)) return v.richText.map(t => t.text || "").join("");
  }
  return String(v).trim();
}

function detectColumns(row) {
  const map = { barcode: -1, name: -1, qty: -1, mfg: -1, expiry: -1, note: -1 };
  row.eachCell((cell, colNumber) => {
    const raw = String(cell.value?.text || cell.value || "").toLowerCase();
    // Normalize: remove diacritics & spaces for flexible matching
    const norm = raw.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");

    if (norm.includes("barcode") || norm.includes("mavach") || norm.includes("code") || norm === "ma") {
      if (map.barcode === -1) map.barcode = colNumber;
    } else if (norm.includes("tensanpham") || norm.includes("tensp") || norm.includes("product") || norm.includes("name") || norm === "ten") {
      if (map.name === -1) map.name = colNumber;
    } else if (norm.includes("soluong") || norm.includes("qty") || norm.includes("quantity") || norm === "sl") {
      if (map.qty === -1) map.qty = colNumber;
    } else if (norm.includes("sanxuat") || norm.includes("nsx") || norm.includes("mfg")) {
      if (map.mfg === -1) map.mfg = colNumber;
    } else if (norm.includes("hansudung") || norm.includes("handung") || norm.includes("hsd") || norm.includes("expiry") || norm.includes("exp")) {
      if (map.expiry === -1) map.expiry = colNumber;
    } else if (norm.includes("ghichu") || norm.includes("note") || norm.includes("mota")) {
      if (map.note === -1) map.note = colNumber;
    }
  });
  return map;
}

function parseCsvRows(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];

  const parseLine = line => {
    const row = [];
    let inQuotes = false;
    let cur = "";
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        row.push(cur.trim()); cur = "";
      } else {
        cur += c;
      }
    }
    row.push(cur.trim());
    return row;
  };

  const headerRow = parseLine(lines[0]);
  const map = { barcode: -1, name: -1, qty: -1, mfg: -1, expiry: -1, note: -1 };
  headerRow.forEach((col, idx) => {
    const norm = col.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
    if (norm.includes("barcode") || norm.includes("mavach") || norm.includes("code") || norm === "ma") {
      if (map.barcode === -1) map.barcode = idx;
    } else if (norm.includes("tensanpham") || norm.includes("tensp") || norm.includes("product") || norm.includes("name") || norm === "ten") {
      if (map.name === -1) map.name = idx;
    } else if (norm.includes("soluong") || norm.includes("qty") || norm.includes("quantity") || norm === "sl") {
      if (map.qty === -1) map.qty = idx;
    } else if (norm.includes("sanxuat") || norm.includes("nsx") || norm.includes("mfg")) {
      if (map.mfg === -1) map.mfg = idx;
    } else if (norm.includes("hansudung") || norm.includes("handung") || norm.includes("hsd") || norm.includes("expiry") || norm.includes("exp")) {
      if (map.expiry === -1) map.expiry = idx;
    } else if (norm.includes("ghichu") || norm.includes("note") || norm.includes("mota")) {
      if (map.note === -1) map.note = idx;
    }
  });

  if (map.barcode === -1) {
    map.barcode = 0; map.name = 1; map.qty = 2; map.mfg = 3; map.expiry = 4; map.note = 6;
  }

  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseLine(lines[i]);
    const barcode = cols[map.barcode];
    if (!barcode) continue;
    result.push({
      barcode: String(barcode).trim(),
      name:    map.name !== -1 ? String(cols[map.name] || "").trim() : "",
      qty:     map.qty !== -1 ? Math.max(1, parseInt(cols[map.qty]) || 1) : 1,
      mfg:     map.mfg !== -1 ? parseExcelDate(cols[map.mfg]) : "",
      expiry:  map.expiry !== -1 ? parseExcelDate(cols[map.expiry]) : "",
      note:    map.note !== -1 ? String(cols[map.note] || "").trim() : "",
      photo:   ""
    });
  }
  return result;
}

$("importXlsxBtn").onclick = () => $("importXlsxInput").click();

$("importXlsxInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  $("importXlsxBtn").disabled  = true;
  $("importXlsxBtn").innerHTML = '<span class="spinner"></span>Đang đọc file...';

  try {
    const isCsv = file.name.toLowerCase().endsWith(".csv");
    let rowsData = [];

    if (isCsv) {
      const text = await file.text();
      rowsData = parseCsvRows(text);
    } else {
      await loadExcelJS();
      $("importXlsxBtn").innerHTML = '<span class="spinner"></span>Đang phân tích bảng tính...';

      const buffer = await file.arrayBuffer();
      const wb     = new ExcelJS.Workbook();
      await wb.xlsx.load(buffer);

      const ws = wb.worksheets[0];
      if (!ws) throw new Error("File Excel không có trang tính (worksheet) nào!");

      // Extract embedded images if available
      const imageMap = {};
      try {
        const images = ws.getImages ? ws.getImages() : [];
        for (const img of images) {
          const media = wb.model.media && wb.model.media[img.imageId];
          if (media) {
            const rowIdx = Math.round(img.range?.tl?.row ?? img.range?.tl?.nativeRow ?? -1);
            if (rowIdx >= 0) {
              let b64 = "";
              if (media.base64) {
                b64 = `data:image/${media.extension || "jpeg"};base64,${media.base64}`;
              } else if (media.buffer) {
                const bytes = new Uint8Array(media.buffer);
                let binary = "";
                for (let b = 0; b < bytes.byteLength; b++) binary += String.fromCharCode(bytes[b]);
                b64 = `data:image/${media.extension || "jpeg"};base64,${btoa(binary)}`;
              }
              if (b64) imageMap[rowIdx] = b64;
            }
          }
        }
      } catch (err) {
        console.warn("Lưu ý: Không đọc được ảnh từ Excel:", err);
      }

      // Detect header row
      let headerRowIndex = 1;
      let colMap = { barcode: -1, name: -1, qty: -1, mfg: -1, expiry: -1, note: -1 };

      for (let r = 1; r <= Math.min(6, ws.rowCount); r++) {
        const row = ws.getRow(r);
        const map = detectColumns(row);
        if (map.barcode !== -1 || map.name !== -1) {
          colMap = map;
          headerRowIndex = r;
          break;
        }
      }

      if (colMap.barcode === -1) {
        colMap = { barcode: 1, name: 2, qty: 3, mfg: 4, expiry: 5, note: 6 };
      }

      for (let r = headerRowIndex + 1; r <= ws.rowCount; r++) {
        const row = ws.getRow(r);
        const barcodeVal = getCellValue(row.getCell(colMap.barcode));
        if (!barcodeVal) continue;

        const nameVal   = colMap.name !== -1 ? getCellValue(row.getCell(colMap.name)) : "";
        const qtyVal    = colMap.qty !== -1 ? getCellValue(row.getCell(colMap.qty)) : 1;
        const mfgVal    = colMap.mfg !== -1 ? parseExcelDate(row.getCell(colMap.mfg).value) : "";
        const expiryVal = colMap.expiry !== -1 ? parseExcelDate(row.getCell(colMap.expiry).value) : "";
        const noteVal   = colMap.note !== -1 ? getCellValue(row.getCell(colMap.note)) : "";

        // Check image in row
        const photo = imageMap[r - 1] || imageMap[r] || "";

        rowsData.push({
          barcode: String(barcodeVal).trim(),
          name:    String(nameVal || "").trim(),
          qty:     Math.max(1, parseInt(qtyVal) || 1),
          mfg:     mfgVal,
          expiry:  expiryVal,
          note:    String(noteVal || "").trim(),
          photo
        });
      }
    }

    if (!rowsData.length) {
      showMsg("Không tìm thấy dữ liệu barcode hợp lệ trong file!", false);
      return;
    }

    const action = confirm(
      `Tìm thấy ${rowsData.length} sản phẩm từ file!\n\n` +
      `• Bấm [OK] để THÊM TIẾP vào danh sách hiện tại (${records.length} mục).\n` +
      `• Bấm [Cancel] để hủy thao tác.`
    );
    if (!action) return;

    // Non-blocking chunked import to keep UI 100% responsive
    $("importXlsxBtn").innerHTML = `<span class="spinner"></span> Đang nạp 0/${rowsData.length}...`;
    const newRecords   = [];
    const photoEntries = [];

    const CHUNK_SIZE = 120;
    for (let i = 0; i < rowsData.length; i++) {
      const item = rowsData[i];
      const id   = genId();

      // If name missing in file, lookup in catalog!
      let pName = item.name;
      if (!pName && catalog[item.barcode]) {
        pName = catalog[item.barcode];
      } else if (pName && item.barcode) {
        // Learn product name into catalog
        catalog[item.barcode] = pName;
      }

      if (item.photo) {
        photoEntries.push([id, item.photo]);
        cacheSet(id, item.photo);
      }

      newRecords.push({
        id,
        barcode:   item.barcode,
        name:      pName,
        qty:       item.qty,
        mfg:       item.mfg,
        expiry:    item.expiry,
        note:      item.note,
        hasPhoto:  !!item.photo,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });

      // Yield every CHUNK_SIZE items
      if (i % CHUNK_SIZE === 0 && i > 0) {
        $("importXlsxBtn").innerHTML = `<span class="spinner"></span> Đang nạp ${i}/${rowsData.length}...`;
        await new Promise(r => setTimeout(r, 0));
      }
    }

    // Save photos in parallel batches
    if (photoEntries.length) {
      $("importXlsxBtn").innerHTML = `<span class="spinner"></span> Đang lưu ảnh...`;
      await batchSavePhotos(photoEntries);
    }

    records = records.concat(newRecords);
    invalidateAll();
    storeRecords();
    storeCatalog();
    updateSuggestions();

    await render();
    showMsg(`✅ Đã nhập thành công ${newRecords.length} sản phẩm và cập nhật danh mục tên!`, true);

  } catch(err) {
    console.error("Import error:", err);
    showMsg("Lỗi khi nhập file: " + err.message, false);
  } finally {
    $("importXlsxInput").value = "";
    $("importXlsxBtn").disabled = false;
    $("importXlsxBtn").textContent = "📥 Nhập Excel / CSV";
  }
};


// ════════════════════════════════════════════════════════════
// 14. BACKUP / RESTORE JSON
// ════════════════════════════════════════════════════════════
$("jsonBtn").onclick = async () => {
  $("jsonBtn").disabled  = true;
  $("jsonBtn").innerHTML = '<span class="spinner spinner-dark"></span>Đang sao lưu...';
  try {
    const withPhotos = records.filter(r => r.hasPhoto);
    const photos     = withPhotos.length
      ? await fetchPhotos(withPhotos.map(r => r.id)) : {};
    const backup = {
      version:    3,
      exportedAt: new Date().toISOString(),
      records,
      catalog,
      photos
    };
    download(
      new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }),
      `barcode_backup_${fmtDate()}.json`
    );
    showMsg("Sao lưu thành công!", true);
  } catch(err) {
    showMsg("Lỗi sao lưu: " + err.message, false);
  } finally {
    $("jsonBtn").disabled    = false;
    $("jsonBtn").textContent = "&#128190; Sao lưu JSON";
  }
};

$("restoreBtn").onclick = () => $("restoreInput").click();

$("restoreInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  if (!confirm(
    "Khôi phục sẽ GHI ĐÈ toàn bộ " + records.length + " bản ghi hiện tại.\nBạn chắc chắn muốn tiếp tục?"
  )) { e.target.value = ""; return; }

  $("restoreBtn").disabled  = true;
  $("restoreBtn").innerHTML = '<span class="spinner spinner-dark"></span>Đang khôi phục...';

  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (Array.isArray(data)) {
      const migrated     = [];
      const photoEntries = [];
      for (const r of data) {
        const id = r.id || genId();
        if (r.photo) {
          photoEntries.push([id, r.photo]);
          cacheSet(id, r.photo);
        }
        migrated.push({
          id,
          barcode:   r.barcode  || "",
          name:      r.name     || "",
          qty:       r.qty      || 1,
          mfg:       r.mfg      || "",
          expiry:    r.expiry   || "",
          note:      r.note     || "",
          hasPhoto:  !!r.photo,
          createdAt: r.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      await batchSavePhotos(photoEntries);
      records = migrated;
    } else {
      records = data.records || [];
      if (data.catalog) {
        catalog = Object.assign({}, catalog, data.catalog);
        storeCatalog();
      }
      const photos       = data.photos || {};
      const photoEntries = Object.entries(photos);
      for (const [id, url] of photoEntries) cacheSet(id, url);
      batchSavePhotos(photoEntries).catch(console.error);
    }

    // Sync catalog from records
    for (const r of records) {
      if (r.barcode && r.name) catalog[r.barcode] = r.name;
    }
    storeCatalog();
    updateSuggestions();

    invalidateAll();
    storeRecords();
    await render();
    showMsg("Khôi phục thành công! " + records.length + " bản ghi.", true);
  } catch(err) {
    showMsg("File không hợp lệ: " + err.message, false);
  } finally {
    e.target.value = "";
    $("restoreBtn").disabled    = false;
    $("restoreBtn").textContent = "&#9851;&#65039; Khôi phục JSON";
  }
};


// ════════════════════════════════════════════════════════════
// 15. RESET ALL DATA
// ════════════════════════════════════════════════════════════
function clearAllPhotosDB() {
  return idbOp("readwrite", s => s.clear());
}

$("resetBtn").onclick = async () => {
  if (!records.length && !Object.keys(catalog).length) {
    showMsg("Không có dữ liệu để xóa.", false); return;
  }
  if (!confirm("XÓA TOÀN BỘ " + records.length + " bản ghi, tất cả ảnh và danh mục sản phẩm?\n\nHành động này KHÔNG THỂ hoàn tác!")) return;
  if (!confirm("Xác nhận lần 2: Toàn bộ dữ liệu sẽ bị xóa vĩnh viễn. Tiếp tục?")) return;

  $("resetBtn").disabled  = true;
  $("resetBtn").innerHTML = '<span class="spinner"></span>Đang xóa...';

  try {
    records = [];
    catalog = {};
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_KEY_CATALOG);
    await clearAllPhotosDB();
    photoCache.clear();
    invalidateAll();
    updateSuggestions();
    clearForm();
    await render();
    showMsg("Đã xóa toàn bộ dữ liệu!", true);
  } catch(err) {
    showMsg("Lỗi reset: " + err.message, false);
  } finally {
    $("resetBtn").disabled    = false;
    $("resetBtn").textContent = "&#128465; Xóa toàn bộ dữ liệu";
  }
};


// ════════════════════════════════════════════════════════════
// 16. INIT — auto-migrates v2 -> v3, loads records & catalog
// ════════════════════════════════════════════════════════════
async function init() {
  const oldRaw = localStorage.getItem(LS_KEY_V2);
  const newRaw = localStorage.getItem(LS_KEY);

  if (oldRaw && !newRaw) {
    try {
      const oldRecs      = JSON.parse(oldRaw);
      const migrated     = [];
      const photoEntries = [];
      for (const r of oldRecs) {
        const id = genId();
        if (r.photo) {
          photoEntries.push([id, r.photo]);
          cacheSet(id, r.photo);
        }
        migrated.push({
          id,
          barcode:   r.barcode  || "",
          name:      r.name     || "",
          qty:       r.qty      || 1,
          mfg:       r.mfg      || "",
          expiry:    r.expiry   || "",
          note:      r.note     || "",
          hasPhoto:  !!r.photo,
          createdAt: r.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      await batchSavePhotos(photoEntries);
      records = migrated;
      invalidateAll();
      storeRecords();
      showMsg("Đã chuyển " + records.length + " bản ghi từ phiên bản cũ!", true);
    } catch(e) {
      console.error("Migration failed:", e);
      loadRecords();
    }
  } else {
    loadRecords();
  }

  loadCatalog();
  await render();
}

init();
</script>
